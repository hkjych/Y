name: daily-sub

on:
  schedule:
    - cron: '0 */8 * * *'        # 每 8 小时(UTC 00/08/16)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 + 聚合 + 测速 + 生成订阅
        run: python crawler.py

      - name: 提交订阅文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscription.yaml data/state.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "daily: update subscription $(date -u +%F)"
            git push
          fi

      # 谁最后跑完谁触发 Z:保证 Z 抓的是 X、Y 都更新过的数据
      - name: 通知 Z 抓取
        if: success()
        env:
          GH_TOKEN: ${{ secrets.Z_DISPATCH_TOKEN }}
        run: |
          status=$(gh api "repos/hkjych/X/actions/workflows/fetch.yml/runs?per_page=1" --jq '.workflow_runs[0].status // "idle"')
          echo "X 最新运行状态: $status"
          case "$status" in
            queued|in_progress|requested|waiting|pending)
              echo "X 还在跑,交给 X 结束后触发 Z"
              exit 0
              ;;
          esac
          gh api -X POST repos/hkjych/Z/dispatches -f event_type=upstream-done
          echo "已触发 Z 抓取"

